name: Velocity-Suite CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Workspace Test & Audit
    runs-on: ubuntu-22.04
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake clang llvm liburing-dev linux-libc-dev

      - name: Workspace Cargo Check
        run: cargo check --workspace --all-targets

      - name: VelocityMQ Tests
        run: cargo test -p velocity_mq --no-fail-fast -- --nocapture

      - name: VelocityDB Tests
        run: cargo test -p velocitydb --no-fail-fast -- --nocapture
